name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README_FA.md', 'store/**']
  workflow_dispatch:
    inputs:
      shots:
        description: "Take store screenshots"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SP_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SP_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SP_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.SP_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > smartplant-release.jks
            printf "storeFile=smartplant-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KS_PASS" "$KS_ALIAS" "$KS_KEYPASS" > keystore.properties
          elif git ls-remote --exit-code --heads origin sp-signing >/dev/null 2>&1; then
            git fetch -q --depth 1 origin sp-signing
            git show FETCH_HEAD:smartplant-release.jks > smartplant-release.jks
            git show FETCH_HEAD:keystore.properties > keystore.properties
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore smartplant-release.jks -alias smartplant -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Amin Smart Management Research Group, O=aminim.ir, C=IR"
            printf "storeFile=smartplant-release.jks\nstorePassword=%s\nkeyAlias=smartplant\nkeyPassword=%s\n" "$PASS" "$PASS" > keystore.properties
            mkdir -p /tmp/sig && cp smartplant-release.jks keystore.properties /tmp/sig/
            cd /tmp/sig && git init -q -b sp-signing && git config user.name "github-actions" && git config user.email "actions@github.com"
            git add -A && git commit -qm "release signing key (keep safe)"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sp-signing
          fi

      - name: Build
        env:
          SP_AI_URL: ${{ secrets.SP_AI_URL || secrets.SL_AI_URL }}
          SP_AI_KEY: ${{ secrets.SP_AI_KEY || secrets.SL_AI_KEY }}
          SP_AI_MODEL: ${{ secrets.SP_AI_MODEL || secrets.SL_AI_MODEL }}
          SP_AVAL_KEY: ${{ secrets.SP_AVAL_KEY || secrets.SL_AVAL_KEY }}
          SP_AVAL_MODEL: ${{ secrets.SP_AVAL_MODEL || secrets.SL_AVAL_MODEL }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          echo "========== ERRORS =========="
          grep -E "^e: |error:|What went wrong|FAILED|Could not" -A4 build.log | head -150 || true
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/build.log
          grep -E "^e: |error:|What went wrong|Could not|FAILED" -A6 build.log > /tmp/log/errors.txt || true
          cd /tmp/log && git init -q -b sp-ci-log && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "log ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sp-ci-log

      - name: AI key probe (status codes only)
        if: always()
        env:
          AVAL_KEY: ${{ secrets.SP_AVAL_KEY || secrets.SL_AVAL_KEY }}
          PO_KEY: ${{ secrets.SP_AI_KEY || secrets.SL_AI_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, base64, struct, zlib, urllib.request
          def png(w=64,h=64):
              raw=b''.join(b'\x00'+bytes([40,160,60])*w for _ in range(h))
              def ch(t,d): c=struct.pack('>I',len(d))+t+d; return c+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b'')
          img='data:image/png;base64,'+base64.b64encode(png()).decode()
          def test(name,url,key,model):
              if not key: return f"{name}: NO_KEY"
              body={"model":model,"max_tokens":40,"messages":[{"role":"user","content":[{"type":"text","text":"What color is this image? one word"},{"type":"image_url","image_url":{"url":img}}]}]}
              if not model.startswith('openai'): body["temperature"]=0
              else: body["max_tokens"]=1500
              r=urllib.request.Request(url,json.dumps(body).encode(),{"Content-Type":"application/json","Authorization":"Bearer "+key})
              try:
                  with urllib.request.urlopen(r,timeout=120) as x:
                      o=json.load(x); a=o["choices"][0]["message"]["content"]
                      return f"{name}: OK vision_answer={a.strip()[:20]!r} keylen={len(key)}"
              except urllib.error.HTTPError as e: return f"{name}: HTTP {e.code} {e.read()[:150]!r}"
              except Exception as e: return f"{name}: ERR {type(e).__name__}"
          out=[test("avalai","https://api.avalai.ir/v1/chat/completions",os.environ.get("AVAL_KEY","").strip(),"gpt-4.1"),
               test("pollinations-large","https://gen.pollinations.ai/v1/chat/completions",os.environ.get("PO_KEY","").strip(),"openai-large"),
               test("pollinations","https://gen.pollinations.ai/v1/chat/completions",os.environ.get("PO_KEY","").strip(),"openai")]
          open("/tmp/probe.txt","w").write("\n".join(out)+"\n"); print("\n".join(out))
          PY
          mkdir -p /tmp/pr && cp /tmp/probe.txt /tmp/pr/ && cd /tmp/pr && git init -q -b sp-probe && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "probe ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sp-probe

      - uses: actions/upload-artifact@v4
        with:
          name: SmartPlant-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish APKs to sp-apk branch
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/*.apk /tmp/out/SmartPlant-debug.apk
          cp app/build/outputs/apk/release/*.apk /tmp/out/SmartPlant-release.apk
          ls -la /tmp/out
          cd /tmp/out
          git init -q -b sp-apk && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sp-apk

  screenshots:
    needs: build
    if: contains(github.event.head_commit.message, '[shots]') || (github.event_name == 'workflow_dispatch' && inputs.shots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartPlant-APK
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/shots.sh
      - name: Publish screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/s && cp -r shots/* /tmp/s/ 2>/dev/null || true
          cd /tmp/s
          git init -q -b sp-shots && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "screenshots ${GITHUB_SHA}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sp-shots
